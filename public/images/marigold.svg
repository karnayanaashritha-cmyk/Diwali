    <!-- Center Core -->
    <circle cx="0" cy="0" r="38" fill="url(#mgCenterGlow)" stroke="#E65100" stroke-width="2"/>
    <circle cx="-8" cy="-8" r="3" fill="#BF360C" opacity="0.7"/>
    <circle cx="10" cy="-6" r="3" fill="#BF360C" opacity="0.7"/>
    <circle cx="-4" cy="9" r="2.8" fill="#BF360C" opacity="0.7"/>
    <circle cx="8" cy="8" r="2.5" fill="#BF360C" opacity="0.7"/>
