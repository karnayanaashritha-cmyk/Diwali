      <use href="#mgPetal" transform="rotate(215) scale(0.85)"/>
      <use href="#mgPetal" transform="rotate(245) scale(0.85)"/>
      <use href="#mgPetal" transform="rotate(275) scale(0.85)"/>
      <use href="#mgPetal" transform="rotate(305) scale(0.85)"/>
      <use href="#mgPetal" transform="rotate(335) scale(0.85)"/>
