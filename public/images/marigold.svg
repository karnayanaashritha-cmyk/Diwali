      <use href="#mgPetal" transform="rotate(50) scale(1.12)"/>
      <use href="#mgPetal" transform="rotate(70) scale(1.12)"/>
      <use href="#mgPetal" transform="rotate(90) scale(1.12)"/>
      <use href="#mgPetal" transform="rotate(110) scale(1.12)"/>
