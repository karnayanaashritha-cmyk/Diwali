<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mgCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF256" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>
    <linearGradient id="mgPetal1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="mgPetal2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="mgPetal3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#FF8F00" />
