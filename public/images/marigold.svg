      <use href="#mgPetal" transform="rotate(160) scale(1.35)"/>
      <use href="#mgPetal" transform="rotate(180) scale(1.35)"/>
      <use href="#mgPetal" transform="rotate(200) scale(1.35)"/>
      <use href="#mgPetal" transform="rotate(220) scale(1.35)"/>
