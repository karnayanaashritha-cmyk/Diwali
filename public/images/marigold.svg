    <!-- Ruffled Petal -->
    <path id="mgPetal" d="M0,0 C-18,-35 -26,-75 0,-125 C26,-75 18,-35 0,0 Z" stroke="#BF360C" stroke-width="1.2" stroke-linejoin="round"/>
